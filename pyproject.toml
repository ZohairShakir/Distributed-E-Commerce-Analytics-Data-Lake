[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "distributed-ecommerce-analytics-data-lake"
version = "0.1.0"
description = "A local-first distributed e-commerce analytics data lake built with PySpark"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
  "boto3==1.43.116",
  "pyspark==3.5.9",
]

[project.optional-dependencies]
dev = [
  "pytest==9.1.1",
  "pytest-cov==7.0.0",
  "ruff==0.17.1",
]

[project.scripts]
generate-data = "aws_spark_data_platform.generator.cli:main"
spark-smoke-job = "aws_spark_data_platform.orchestration.smoke_job:main"
bronze-ingestion = "aws_spark_data_platform.orchestration.bronze_job:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
markers = [
  "integration: starts a local Spark session",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
